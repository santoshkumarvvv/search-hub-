services:
  - type: web
    name: mediahub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Optional. Without it the catalog serves anime only.
      - key: TMDB_API_KEY
        sync: false
