<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AnimeHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- torii gate -->
  <g fill="url(#accent)" opacity="0.9" filter="url(#glow)">
    <rect x="86" y="120" width="340" height="26" rx="13"/>
    <rect x="112" y="166" width="288" height="20" rx="10"/>
    <rect x="140" y="186" width="30" height="200" rx="8"/>
    <rect x="342" y="186" width="30" height="200" rx="8"/>
  </g>

  <!-- play triangle -->
  <path d="M214 214 L214 358 L338 286 Z" fill="#f8fafc" opacity="0.96"/>
</svg>
