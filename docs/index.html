<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AnimeHub — Project Titan</title>
<style>
:root{--bg:#060606;--card:#121212;--green:#16a34a;--glow:#22c55e;--green-bg:rgba(22,163,74,0.12);--text:#f0f0f0;--t2:#999;--t3:#555;--border:rgba(255,255,255,0.06);--r:8px;--rr:20px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:400;overflow-x:hidden;letter-spacing:-0.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;padding:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;padding:12px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;padding:16px;max-width:1700px;margin:0 auto}}
.sentinel{height:1px;grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s ease-in-out,box-shadow .2s ease-in-out,border-color .2s ease-in-out;border:1px solid var(--border);contain:content}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,0.6);border-color:rgba(34,197,94,0.25)}
.card:active{transform:scale(.98);transition:transform .08s ease-in-out}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .3s ease-in-out}
.card:hover .card-img{transform:scale(1.04)}
.card-body{padding:9px 10px 10px}
.card-title{font-size:12.5px;font-weight:600;line-height:1.25;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.card-meta{font-size:10.5px;color:var(--t2);display:flex;align-items:center;gap:5px}
.card-score{color:var(--glow);font-weight:600}
.card-badge{display:inline-block;background:var(--green-bg);color:var(--glow);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:5px}
.card-badge.sub{background:rgba(249,115,22,0.12);color:#f97316}
.load-more{display:block;width:100%;padding:12px;margin:8px 0;background:var(--card);border:1px solid var(--border);color:var(--t2);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:var(--r);grid-column:1/-1;text-align:center;transition:all .2s ease-in-out}
.load-more:hover{border-color:var(--green);color:var(--glow);background:var(--card-hover)}
.panel{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;flex-direction:column;animation:fadeIn .18s ease-in-out}
.panel.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel-back{position:fixed;top:10px;left:10px;z-index:110;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--t2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s ease-in-out;backdrop-filter:blur(10px)}
.panel-back:hover{background:var(--green);color:#fff;border-color:var(--green);transform:scale(1.06)}
.panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:50px;scroll-behavior:smooth}
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player-iframe{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:2}
.info{padding:16px 16px 10px}
.info-title{font-size:21px;font-weight:700;margin-bottom:5px;letter-spacing:-0.02em}
.info-meta{font-size:12px;color:var(--t2);margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.info-synopsis{font-size:12.5px;color:var(--t2);line-height:1.55;margin-bottom:0;font-weight:400}
.actions{display:flex;gap:5px;padding:0 16px 10px;flex-wrap:wrap}
.act-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--rr);background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--t2);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out}
.act-pill:hover{background:rgba(255,255,255,0.08);color:var(--text);border-color:rgba(255,255,255,0.12)}
.audio-row{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap}
.audio-btn{padding:5px 12px;border-radius:var(--rr);background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--t2);font-size:10.5px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out}
.audio-btn:hover:not(:disabled){background:rgba(255,255,255,0.06);color:var(--text)}
.audio-btn:disabled{opacity:.25;cursor:not-allowed}
.audio-btn.active{background:rgba(22,163,74,0.18);border-color:rgba(34,197,94,0.4);color:var(--glow);box-shadow:0 0 12px rgba(22,163,74,0.15)}
.ep-section{padding:0 16px 20px}
.ep-label{font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px}
.ep-chip{padding:7px 1px;border-radius:6px;background:rgba(255,255,255,0.025);border:1px solid var(--border);color:var(--t2);font-size:10.5px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s ease-in-out;position:relative}
.ep-chip:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.ep-chip:active{transform:scale(.94);transition:all .06s ease-in-out}
.ep-chip.active{background:var(--green);border-color:var(--glow);color:#fff;font-weight:600;box-shadow:0 0 14px rgba(22,163,74,0.35)}
.ep-chip.resolved{border-color:rgba(34,197,94,0.35);background:rgba(22,163,74,0.08)}
.ep-chip.watched::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--glow)}
.range-jump{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.range-btn{padding:4px 9px;border-radius:5px;background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--t3);font-size:10px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out}
.range-btn:hover{background:rgba(255,255,255,0.05);color:var(--t2)}
.range-btn.active{background:rgba(22,163,74,0.15);border-color:rgba(34,197,94,0.3);color:var(--glow)}
.fallback-indicator{position:fixed;top:8px;right:8px;z-index:120;background:rgba(0,0,0,0.7);color:var(--glow);font-size:9px;font-weight:500;padding:3px 8px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid var(--border)}
.fallback-indicator.show{opacity:1}
.fallback-indicator.warn{color:#f59e0b}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%)translateY(100px);background:rgba(18,18,18,0.95);color:var(--text);padding:9px 18px;border-radius:var(--rr);font-size:11.5px;font-weight:500;z-index:200;opacity:0;transition:all .25s cubic-bezier(0.16,1,0.3,1);pointer-events:none;border:1px solid var(--border);backdrop-filter:blur(12px)}
.toast.show{transform:translateX(-50%)translateY(0);opacity:1}
.loader-widget{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:199;background:rgba(18,18,18,0.95);border:1px solid var(--border);border-radius:var(--r);padding:9px 16px;display:none;align-items:center;gap:9px;backdrop-filter:blur(12px)}
.loader-widget.show{display:flex}
.loader-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--glow);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-widget .loader-text{font-size:11.5px;font-weight:500;color:var(--t2)}
</style>
</head>

var _origClose=closePanel;closePanel=function(){TITAN_PING.stop();_origClose();};

// ═══ RENDER ═══
function renderGrid(){var g=$('grid');g.innerHTML='';ANIME.forEach(function(a){var c=document.createElement('div');c.className='card';c.setAttribute('data-id',a.id);var hd=a.langs&&a.langs.hindi;c.innerHTML='<img class="card-img" src="'+a.poster+'" alt="'+a.title+'" loading="lazy" onerror="this.onerror=null;this.src=\'https://picsum.photos/300/450\';"/><div class="card-body">'+(hd?'<span class="card-badge">Hindi</span>':'<span class="card-badge sub">Sub</span>')+'<div class="card-title">'+a.title+'</div><div class="card-meta"><span class="card-score">★ '+(a.score||'—')+'</span>'+(a.eps||0)+' eps · '+(a.year||'')+'</div></div>';c.addEventListener('click',function(){openPanel(a);});g.appendChild(c);});if(S.feched&&S.hasMore&&!S.feching){var lm=document.createElement('button');lm.className='load-more';lm.textContent='Load More (Page '+(S.page+1)+') · '+S.merged+' loaded';lm.addEventListener('click',function(){S.page++;_fetch();});g.appendChild(lm);}}
function _fetch(){S.feching=true;ldr(true,'Fetching page '+S.page+'...');JK.fetchAll(S.page).then(function(d){if(d.results.length>0){if(S.page===1){ANIME=ANIME.filter(function(a){return !a._api;});}var ei={};ANIME.forEach(function(a){ei[a.id]=true;});d.results.forEach(function(a){if(!ei[a.id]){ANIME.push(a);S.merged++;ei[a.id]=true;}});S.total=Math.max(S.total,d.total);S.hasMore=d.hasNext;S.feched=true;}ldr(false);renderGrid();S.feching=false;}).catch(function(){ldr(false);S.feching=false;});}
function setupIS(){if(S.io)S.io.disconnect();S.io=new IntersectionObserver(function(e){if(e[0].isIntersecting&&S.feched&&S.hasMore&&!S.feching&&!S.isFeching){S.isFeching=true;S.page++;_fetch();setTimeout(function(){S.isFeching=false;},1500);}},{rootMargin:'200px'});var s=$('sentinel');if(s)S.io.observe(s);}

function openPanel(a){S.cur=a;S.ep=1;S.range=0;var ak=['hindi','english','japanese'];S.audio='hindi';for(var i=0;i<ak.length;i++){if(a.langs&&a.langs[ak[i]]){S.audio=ak[i];break;}}$('infoTitle').textContent=a.title;$('infoMeta').innerHTML='★ '+(a.score||'—')+' · '+(a.eps||0)+' eps · '+(a.year||'')+' · '+(a.studio||'Studio');$('infoSynopsis').textContent=a.synopsis||'';renderAudioButtons();renderEpChips();updateSaveBtn();TITAN.play(a,1,S.audio);setTimeout(function(){TITAN.preResolve(a);},50);TITAN_PING.start();$('panel').classList.add('open');$('panel').scrollTop=0;document.body.style.overflow='hidden';}
function closePanel(){$('panel').classList.remove('open');$('playerIframe').src='';document.body.style.overflow='';S.resolvedStreams=null;TITAN_PING.stop();}

var AUDIO_LABELS={hindi:'Hindi Dub',english:'English Dub',japanese:'Japanese Sub'};
function renderAudioButtons(){var row=$('audioRow');row.innerHTML='';['hindi','english','japanese'].forEach(function(k){var b=document.createElement('button');b.className='audio-btn'+(S.audio===k?' active':'');b.textContent=AUDIO_LABELS[k];if(S.cur.langs&&!S.cur.langs[k]){b.disabled=true;b.textContent+=' (N/A)';}b.addEventListener('click',function(){if(S.cur.langs&&S.cur.langs[k]){S.audio=k;renderAudioButtons();TITAN.play(S.cur,S.ep,S.audio);toast('🎧 '+AUDIO_LABELS[k]);}});row.appendChild(b);});}
function renderEpChips(){var g=$('epGrid'),jump=$('rangeJump');g.innerHTML='';jump.innerHTML='';$('epCount').textContent=(S.cur.eps||0)+' episodes';var eps=S.cur.eps||12;if(eps>100){var ranges=Math.ceil(eps/100);for(var r=0;r<ranges;r++){(function(range){var rb=document.createElement('button');rb.className='range-btn'+(S.range===range?' active':'');rb.textContent=(range*100+1)+'-'+Math.min((range+1)*100,eps);rb.addEventListener('click',function(){S.range=range;renderEpChips();});jump.appendChild(rb);})(r);}}var start=S.range*100+1,end=Math.min((S.range+1)*100,eps);$('epLabel').textContent='EP '+start+' — EP '+end;for(var i=start;i<=end;i++){(function(ep){var chip=document.createElement('button');chip.className='ep-chip'+(S.ep===ep?' active':'')+(UD.isWatched(S.cur.id,ep)?' watched':'');chip.textContent=String(ep).padStart(3,'0');chip.setAttribute('data-episode',ep);chip.setAttribute('data-anime-id',S.cur.id);chip.setAttribute('data-user-hindi','');chip.setAttribute('data-user-english','');chip.setAttribute('data-user-japanese','');if(S.resolvedStreams&&S.resolvedStreams.hindi&&S.resolvedStreams.hindi[ep]){chip.setAttribute('data-user-hindi',S.resolvedStreams.hindi[ep]);chip.classList.add('resolved');}chip.addEventListener('click',function(){var us=chip.getAttribute('data-user-'+S.audio);if(us&&us.length>5){$('playerIframe').src=us;toast('▶ EP '+ep);S.ep=ep;UD.markWatched(S.cur.id,ep);renderEpChips();return;}TITAN.play(S.cur,ep,S.audio);UD.markWatched(S.cur.id,ep);renderEpChips();});g.appendChild(chip);})(i);}}
function updateSaveBtn(){var b=$('actSave');if(!S.cur)return;var sv=UD.isSaved(S.cur.id);b.innerHTML=sv?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Saved':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Save';b.style.color=sv?'#22c55e':'';}

$('panelBack').addEventListener('click',closePanel);
$('actSave').addEventListener('click',function(){if(!S.cur)return;toast(UD.toggleSave(S.cur)?'❤️ Saved':'Removed');updateSaveBtn();});
$('actShare').addEventListener('click',function(){if(!S.cur)return;if(navigator.share)navigator.share({title:S.cur.title,url:location.href});else navigator.clipboard.writeText(location.href).then(function(){toast('Link copied!');});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('panel').classList.contains('open'))closePanel();});

renderGrid();setupIS();
setTimeout(function(){S.page=1;_fetch();},300);
setTimeout(function(){TITAN.preResolve(SEED.find(function(a){return a._mbKey==='QU18SYuNLb3';}));},1000);
console.log('%c🔥 TITAN — 140+ anime · QU18SYuNLb3 pre-resolved · 3-tier anti-block','color:#22c55e;font-size:14px;');
</script>
