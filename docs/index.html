<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0f172a" />

<!-- Security: lock down script/frame sources. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self';
  frame-src https://www.youtube-nocookie.com https://www.youtube.com;
  object-src 'none';
  base-uri 'self';
  form-action 'none';
  frame-ancestors 'self'
" />
<meta name="referrer" content="no-referrer" />

<title>AnimeHub — Hindi Dubbed Anime Catalog</title>
<meta name="description" content="Browse and search a Hindi-dubbed anime catalog. Fast, offline-capable, installable. Built by Santosh Kumar." />
<meta name="author" content="Santosh Kumar" />

<!-- Open Graph / social -->
<meta property="og:type" content="website" />
<meta property="og:title" content="AnimeHub — Hindi Dubbed Anime Catalog" />
<meta property="og:description" content="Fast, offline-capable Hindi-dubbed anime catalog with instant search and watchlist." />
<meta property="og:image" content="./icon.svg" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="preload" href="./catalog.json" as="fetch" crossorigin="anonymous" />
<link rel="stylesheet" href="./style.css" />
</head>

<body>

<a class="skip-link" href="#grid">Skip to catalog</a>

<header>
  <div class="brand" aria-label="AnimeHub">
    <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
      </defs>
      <rect x="86" y="120" width="340" height="26" rx="13" fill="url(#bm)"/>
      <rect x="112" y="166" width="288" height="20" rx="10" fill="url(#bm)"/>
      <rect x="140" y="186" width="30" height="200" rx="8" fill="url(#bm)"/>
      <rect x="342" y="186" width="30" height="200" rx="8" fill="url(#bm)"/>
      <path d="M214 214 L214 358 L338 286 Z" fill="#f8fafc"/>
    </svg>
    <span class="brand-text">AnimeHub</span>
    <span class="ver">v19</span>
  </div>

  <div class="search" role="search">
    <span aria-hidden="true">🔍</span>
    <label class="sr-only" for="search">Search anime</label>
    <input id="search" type="search" placeholder="Search titles, genres, studios…  ( / )" autocomplete="off" />
    <span class="count" id="count" aria-live="polite">—</span>
  </div>
</header>

<div class="controls">
  <div class="chips" id="filterRow" role="group" aria-label="Filters"></div>
  <div class="sort-wrap">
    <span class="saved-count" id="savedCount" title="Titles in My List" style="display:none"></span>
    <label class="sr-only" for="sortSelect">Sort by</label>
    <select id="sortSelect" class="sort"></select>
  </div>
</div>

<div class="status show warn" id="status" role="status" aria-live="polite">
  <div class="spin" id="statusSpin"></div>
  <span id="statusText">Loading…</span>
</div>

<main class="grid" id="grid" aria-label="Anime catalog"></main>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="dTitle">
  <button class="panel-back" id="panelBack" aria-label="Close details">✕</button>
  <div class="hero" id="hero"></div>
  <div class="detail">
    <div class="player" id="player">
      <div class="ph" id="playerPh">
        <b>▶ Select an episode</b>
        <span class="sub">Video player will appear here</span>
      </div>
    </div>
    <h1 class="d-title" id="dTitle">—</h1>
    <div class="d-meta" id="dMeta"></div>
    <p class="d-syn" id="dSyn">—</p>
    <div class="d-actions">
      <button class="pill primary" id="actPlay">▶ Play EP 01</button>
      <button class="pill" id="actSave" aria-pressed="false">＋ Save</button>
      <button class="pill" id="actShare">↗ Share</button>
    </div>
    <div class="audio-row" id="audioRow" role="group" aria-label="Audio track"></div>
    <div class="ep-label"><span>Episodes</span><span id="epCount"></span></div>
    <div class="ep-grid" id="epGrid" role="group" aria-label="Episode list"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="nojs-note">
    <b>JavaScript is disabled.</b><br />
    AnimeHub needs JavaScript to render the catalog. Please enable it.
  </div>
</noscript>

<footer>
  <p>AnimeHub · offline-capable · installable</p>
  <p class="credit">Built by <a href="https://github.com/santoshkumarvvv" rel="noopener">Santosh Kumar</a> · MIT</p>
</footer>

<script src="./script.js" defer></script>
</body>
</html>
