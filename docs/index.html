<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' width='100' height='100' fill='%2316a34a'/%3E%3Ctext y='70' x='50' text-anchor='middle' font-size='48' fill='white' font-weight='bold'%3EAH%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="ah-grid" id="ahGrid"></div>
  <div class="ah-sentinel" id="ahSentinel"></div>

  <div class="ah-overlay" id="ahOverlay">
    <button class="ah-back" id="ahBackBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="ah-detail-scroll">
      <div class="ah-player-wrap" id="ahPlayerWrap">
        <div class="ah-player-bg" id="ahPlayerBg"></div>
        <div class="ah-player-gradient"></div>
        <iframe id="ahPlayerIframe" class="ah-player-iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <div class="ah-now-playing" id="ahNowPlaying"></div>
      </div>
      <div class="ah-detail-title-row"><h1 class="ah-detail-title" id="ahTitle"></h1></div>
      <div class="ah-meta-row" id="ahMetaRow"></div>
      <div class="ah-action-bar">
        <button class="ah-pill" id="ahListBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> + List</button>
        <button class="ah-pill" id="ahShareBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share</button>
        <button class="ah-pill" id="ahDownloadBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download</button>
      </div>
      <div class="ah-dropdowns">
        <button class="ah-dropdown" id="ahLangDropdown"><span id="ahLangLabel">Hindi dub</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></button>
        <button class="ah-dropdown" id="ahSeasonDropdown"><span id="ahSeasonLabel">Season 01</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div class="ah-ep-wrap"><div class="ah-ep-chips" id="ahEpChips"></div></div>
      <div class="ah-rec-grid" id="ahRecGrid"></div>
    </div>
    <button class="ah-float-dl" id="ahFloatDl"></button>
  </div>

  <div class="ah-sheet-overlay" id="ahLangSheetOverlay">
    <div class="ah-sheet">
      <div class="ah-sheet-header"><h3>Select language</h3><button class="ah-sheet-close" id="ahLangSheetClose">&times;</button></div>
      <div class="ah-sheet-body">
        <button class="ah-lang-btn" data-lang="original">Original Audio</button>
        <button class="ah-lang-btn" data-lang="english">English dub</button>
        <button class="ah-lang-btn active" data-lang="hindi">Hindi dub</button>
        <button class="ah-lang-btn" data-lang="tamil">Tamil dub</button>
        <button class="ah-lang-btn" data-lang="telugu">Telugu dub</button>
      </div>
    </div>
  </div>

  <div class="ah-sheet-overlay" id="ahDlSheetOverlay">
    <div class="ah-sheet">
      <div class="ah-sheet-header"><h3>Download</h3><button class="ah-sheet-close" id="ahDlSheetClose">&times;</button></div>
      <div class="ah-sheet-body">
        <p class="ah-dl-subtitle">Resources by <strong>AnimeHub</strong></p>
        <div class="ah-dl-controls">
          <button class="ah-dropdown ah-dropdown-sm" id="ahDlLangDropdown"><span id="ahDlLangLabel">Hindi dub</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></button>
          <button class="ah-dropdown ah-dropdown-sm" id="ahDlSeasonDropdown"><span id="ahDlSeasonLabel">Season 01</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="ah-dl-quality"><button class="ah-qual-btn" data-quality="360p">360P</button><button class="ah-qual-btn active" data-quality="1080p">1080P</button></div>
        <div class="ah-dl-episodes" id="ahDlEpisodes"></div>
        <div class="ah-dl-bottom">
          <label class="ah-dl-select-all"><input type="checkbox" id="ahDlSelectAll" /><span>Select All</span></label>
          <button class="ah-dl-action" id="ahDlAction"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ah-toast" id="ahToast"></div>
  <div class="ah-loader" id="ahLoader"><div class="ah-loader-spin"></div><div class="ah-loader-text" id="ahLoaderText">Loading...</div></div>
  <div class="ah-stream-badge" id="ahStreamBadge"></div>

  <script src="script.js"></script>
</body>
</html>
