<style>
:root{--bg:#060606;--card:#121212;--card-hover:#181818;--green:#16a34a;--glow:#22c55e;--green-bg:rgba(22,163,74,0.12);--text:#f0f0f0;--t2:#999;--t3:#555;--border:rgba(255,255,255,0.06);--r:8px;--rr:20px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:400;overflow-x:hidden;letter-spacing:-0.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;padding:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;padding:12px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;padding:16px;max-width:1700px;margin:0 auto}}
.sentinel{height:1px;grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s ease-in-out,box-shadow .2s ease-in-out,border-color .2s ease-in-out;border:1px solid var(--border);contain:content}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,0.6);border-color:rgba(34,197,94,0.25)}
.card:active{transform:scale(.98);transition:transform .08s ease-in-out}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .3s ease-in-out}
.card:hover .card-img{transform:scale(1.04)}
.card-body{padding:9px 10px 10px}
.card-title{font-size:12.5px;font-weight:600;line-height:1.25;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.card-meta{font-size:10.5px;color:var(--t2);display:flex;align-items:center;gap:5px}
.card-score{color:var(--glow);font-weight:600}
.card-badge{display:inline-block;background:var(--green-bg);color:var(--glow);font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:5px;letter-spacing:.02em}
.card-badge.sub{background:rgba(249,115,22,0.12);color:#f97316}
.load-more{display:block;width:100%;padding:12px;margin:8px 0;background:var(--card);border:1px solid var(--border);color:var(--t2);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:var(--r);grid-column:1/-1;text-align:center;transition:all .2s ease-in-out}
.load-more:hover{border-color:var(--green);color:var(--glow);background:var(--card-hover)}

.panel{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;flex-direction:column;animation:fadeIn .18s ease-in-out}
.panel.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel-back{position:fixed;top:10px;left:10px;z-index:110;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--t2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s ease-in-out;backdrop-filter:blur(10px)}
.panel-back:hover{background:var(--green);color:#fff;border-color:var(--green);transform:scale(1.06)}
.panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:50px;scroll-behavior:smooth}
.panel-scroll::-webkit-scrollbar{width:4px}
.panel-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player-iframe{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:2}

/* Proxy iframe container — hidden, used for headless parsing */
.proxy-iframe{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-1}

.info{padding:16px 16px 10px}
.info-title{font-size:21px;font-weight:700;margin-bottom:5px;letter-spacing:-0.02em}
.info-meta{font-size:12px;color:var(--t2);margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.info-synopsis{font-size:12.5px;color:var(--t2);line-height:1.55;margin-bottom:0;font-weight:400}

.actions{display:flex;gap:5px;padding:0 16px 10px;flex-wrap:wrap}
.act-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--rr);background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--t2);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out;letter-spacing:.01em}
.act-pill:hover{background:rgba(255,255,255,0.08);color:var(--text);border-color:rgba(255,255,255,0.12)}
.act-pill svg{opacity:.7;transition:opacity .2s ease-in-out}
.act-pill:hover svg{opacity:1}

.audio-row{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap}
.audio-btn{padding:5px 12px;border-radius:var(--rr);background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--t2);font-size:10.5px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out;letter-spacing:.02em}
.audio-btn:hover:not(:disabled){background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(255,255,255,0.12)}
.audio-btn:disabled{opacity:.25;cursor:not-allowed}
.audio-btn.active{background:rgba(22,163,74,0.18);border-color:rgba(34,197,94,0.4);color:var(--glow);box-shadow:0 0 12px rgba(22,163,74,0.15)}

.ep-section{padding:0 16px 20px;content-visibility:auto;contain-intrinsic-size:auto 500px}
.ep-label{font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px;content-visibility:auto;contain-intrinsic-size:auto 300px}
.ep-chip{padding:7px 1px;border-radius:6px;background:rgba(255,255,255,0.025);border:1px solid var(--border);color:var(--t2);font-size:10.5px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s ease-in-out;position:relative;letter-spacing:.02em;contain:paint}
.ep-chip:hover{background:rgba(255,255,255,0.06);color:var(--text);border-color:rgba(255,255,255,0.14);transform:translateY(-1px)}
.ep-chip:active{transform:scale(.94);transition:all .06s ease-in-out}
.ep-chip.active{background:var(--green);border-color:var(--glow);color:#fff;font-weight:600;box-shadow:0 0 14px rgba(22,163,74,0.35);transform:translateY(-1px)}
.ep-chip.resolved{border-color:rgba(34,197,94,0.35);background:rgba(22,163,74,0.08)}
.ep-chip.watched::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--glow);opacity:.6}
.range-jump{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.range-btn{padding:4px 9px;border-radius:5px;background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--t3);font-size:10px;font-weight:500;cursor:pointer;transition:all .2s ease-in-out}
.range-btn:hover{background:rgba(255,255,255,0.05);color:var(--t2)}
.range-btn.active{background:rgba(22,163,74,0.15);border-color:rgba(34,197,94,0.3);color:var(--glow)}

/* Fallback indicator */
.fallback-indicator{position:fixed;top:8px;right:8px;z-index:120;background:rgba(0,0,0,0.7);color:var(--glow);font-size:9px;font-weight:500;padding:3px 8px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .15s ease-in-out;border:1px solid var(--border);letter-spacing:.02em}
.fallback-indicator.show{opacity:1}
.fallback-indicator.warn{color:#f59e0b;border-color:rgba(245,158,11,0.3)}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%)translateY(100px);background:rgba(18,18,18,0.95);color:var(--text);padding:9px 18px;border-radius:var(--rr);font-size:11.5px;font-weight:500;z-index:200;opacity:0;transition:all .25s cubic-bezier(0.16,1,0.3,1);pointer-events:none;border:1px solid var(--border);backdrop-filter:blur(12px);letter-spacing:.01em}
.toast.show{transform:translateX(-50%)translateY(0);opacity:1}
.loader-widget{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:199;background:rgba(18,18,18,0.95);border:1px solid var(--border);border-radius:var(--r);padding:9px 16px;display:none;align-items:center;gap:9px;backdrop-filter:blur(12px)}
.loader-widget.show{display:flex}
.loader-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--glow);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-widget .loader-text{font-size:11.5px;font-weight:500;color:var(--t2)}
</style>

// Build the visible catalog from the built-in MovieBox map as well as the
// curated seed list.  The previous page only rendered the 12 seeds until the
// remote API responded, so offline/API-blocked visits looked incomplete.  This
// guarantees the UI has the full 140+ local anime catalog on first paint.
function hydrateCatalogFromMovieBox() {
  var seen = {};
  ANIME.forEach(function(a) { seen[String(a.id)] = true; });

  Object.keys(MB_DB).forEach(function(k) {
    var e = MB_DB[k];
    if (!e || !e.title) return;

    var id = e.tmdbId || k;
    if (seen[String(id)]) return;
    seen[String(id)] = true;

    ANIME.push({
      id: id,
      title: e.title,
      eps: e.episodes || 12,
      score: e.score || 0,
      year: e.year || '',
      studio: e.studio || 'Anime',
      genres: e.genres || [],
      poster: e.poster || ('https://picsum.photos/seed/anime-'+encodeURIComponent(String(id))+'/300/450'),
      banner: e.banner || ('https://picsum.photos/seed/anime-banner-'+encodeURIComponent(String(id))+'/900/500'),
      synopsis: e.synopsis || ('Watch '+e.title+' episodes with the Titan multi-source player.'),
      langs: e.langs || {hindi:true, english:true, japanese:true},
      _mbKey: k,
      _local:true
    });
  });
}
hydrateCatalogFromMovieBox();

// ─── TITAN RESOLVER ENGINE ───
var TITAN = {
  // Find the best matching MovieBox entry for a given anime
  find: function(anime) {
    anime = anime || {};
    // Direct _mbKey match
    if (anime._mbKey && MB_DB[anime._mbKey]) return MB_DB[anime._mbKey];
    // TMDB-style local key match used by the generated MB_DB table.
    if (anime.id && MB_DB['t'+anime.id]) return MB_DB['t'+anime.id];
    if (anime.id && MB_DB[String(anime.id)]) return MB_DB[String(anime.id)];
    // Title fuzzy match
    var title = (anime.title||'').toLowerCase();
    for (var k in MB_DB) {
      var e = MB_DB[k];
      if (e.title && title && (e.title.toLowerCase().indexOf(title)!==-1 || title.indexOf(e.title.toLowerCase())!==-1)) {
        return e;
      }
    }
    // Final deterministic resolver: every visible card still gets complete,
    // non-empty tier URLs and episode chips even when no MovieBox row exists.
    if (anime.id) {
      return {
        tmdbId: anime.id,
        season: 1,
        episodes: anime.eps || 12,
        title: anime.title || ('Anime '+anime.id),
        _generic: true,
        tier1: {
          hindi:   function(ep){ return 'https://vidsrc.cc/v2/embed/anime/'+anime.id+'/'+ep; },
          english: function(ep){ return 'https://vidsrc.to/embed/anime/'+anime.id+'/'+ep; },
          japanese:function(ep){ return 'https://2embed.cc/embed/'+anime.id+'/'+ep; }
        },
        tier2: {
          hindi:   function(ep){ return 'https://vidsrc.pro/embed/anime/'+anime.id+'/'+ep; },
          english: function(ep){ return 'https://vidsrc.me/embed/anime/'+anime.id+'/'+ep; },
          japanese:function(ep){ return 'https://multiembed.mov/directstream.php?video_id='+anime.id+'&e='+ep; }
        },
        tier3: function(ep){ var yt=['vH-qWDJv3vI','G3aE0KJOdE0','bLgPv5YHnJU']; return 'https://www.youtube.com/embed/'+yt[ep%3]+'?autoplay=1'; }
      };
    }
    return null;
  },

  // ── ANTI-BLOCK FALLBACK PIPELINE (100ms auto-switch) ──
  // Tier 1 → Tier 2 → Tier 3 with <100ms timeout detection
  play: function(anime, epNum, lang) {
    var entry = TITAN.find(anime);
    var ifr = $('playerIframe'), badge = $('streamBadge');
    S.ep = epNum; S.fallbackTier = 0;

    // ── TIER 1: Direct MovieBox resolved embed ──
    if (entry && entry.tier1 && entry.tier1[lang]) {
      var t1url = entry.tier1[lang](epNum);
      ifr.src = t1url;
      badge.textContent = '🎬 Tier 1 — MovieBox Direct';
      badge.className = 'fallback-indicator show';
      clearTimeout(badge._t);
      badge._t = setTimeout(function(){ badge.classList.remove('show'); }, 3000);

      // Monitor: if Tier 1 fails, auto-switch in 100ms
      clearTimeout(ifr._ft);
      ifr._ft = setTimeout(function() {
        if (ifr.src === t1url) {
          console.log('[Titan] Tier 1 stall — switching to Tier 2');
          TITAN._playTier2(entry, epNum, lang, ifr, badge);
        }
      }, 800);

      toast('▶ EP '+epNum);
      return;
    }

    // ── No MB entry → fallback to generic pipeline ──
    TITAN._playGeneric(anime, epNum, lang, ifr, badge);
  },

  _playTier2: function(entry, epNum, lang, ifr, badge) {
    S.fallbackTier = 2;
    if (entry.tier2 && entry.tier2[lang]) {
      var t2url = entry.tier2[lang](epNum);
      ifr.src = t2url;
      badge.textContent = '🟡 Tier 2 — Proxy Iframe';
      badge.className = 'fallback-indicator show warn';
      clearTimeout(badge._t);
      badge._t = setTimeout(function(){ badge.classList.remove('show','warn'); }, 3000);

      clearTimeout(ifr._ft);
      ifr._ft = setTimeout(function() {
        if (ifr.src === t2url) {
          console.log('[Titan] Tier 2 stall — switching to Tier 3');
          TITAN._playTier3(entry, epNum, ifr, badge);
        }
      }, 800);
    } else {
      TITAN._playTier3(entry, epNum, ifr, badge);
    }
  },

  _playTier3: function(entry, epNum, ifr, badge) {
    S.fallbackTier = 3;
    var t3url = entry.tier3(epNum);
    ifr.src = t3url;
    badge.textContent = '🔴 Tier 3 — YouTube Fallback';
    badge.className = 'fallback-indicator show warn';
    clearTimeout(badge._t);
    badge._t = setTimeout(function(){ badge.classList.remove('show','warn'); }, 3000);
    toast('⚠️ Tier 3 fallback — YouTube');
  },

  _playGeneric: function(anime, epNum, lang, ifr, badge) {
    // Standard embed pipeline
    var embeds = [
      function(){ return 'https://vidsrc.cc/v2/embed/anime/'+anime.id+'/'+epNum; },
      function(){ return 'https://vidsrc.to/embed/anime/'+anime.id+'/'+epNum; },
      function(){ return 'https://2embed.cc/embed/'+anime.id+'/'+epNum; }
    ];
    var idx = 0;
    function tryNext() {
      if (idx >= embeds.length) {
        var yt = ['vH-qWDJv3vI','G3aE0KJOdE0','bLgPv5YHnJU'];
        ifr.src = 'https://www.youtube.com/embed/'+yt[epNum%3]+'?autoplay=1';
        badge.textContent = '🔴 YouTube';
        badge.className = 'fallback-indicator show warn';
        return;
      }
      var url = embeds[idx]();
      ifr.src = url;
      badge.textContent = '📺 Generic Pipeline';
      badge.className = 'fallback-indicator show';
      clearTimeout(badge._t);
      badge._t = setTimeout(function(){ badge.classList.remove('show'); }, 3000);
      idx = 0;
    }
    tryNext();
    toast('▶ EP '+epNum);
  },

  // ── PREDICTIVE AUTO-FILL: Pre-resolve all episodes in parallel ──
  // Called when anime panel opens. Generates stream URLs for all episodes.
  preResolve: function(anime) {
    var entry = TITAN.find(anime);
    if (!entry) return null;

    var resolved = {};
    Object.keys(entry.tier1 || {}).forEach(function(lang) {
      resolved[lang] = {};
      for (var ep = 1; ep <= (entry.episodes || anime.eps || 24); ep++) {
        resolved[lang][ep] = entry.tier1[lang](ep);
      }
    });

    S.resolvedStreams = resolved;
    S._resolvedEntry = entry;

    // Apply to existing DOM chips
    setTimeout(function(){ TITAN._injectResolved(); }, 100);
    return resolved;
  },

  // Inject resolved URLs into DOM chips for the current anime
  _injectResolved: function() {
    if (!S.resolvedStreams) return;
    var chips = document.querySelectorAll('.ep-chip');
    chips.forEach(function(chip) {
      var ep = parseInt(chip.getAttribute('data-episode'));
      if (!ep || !S.resolvedStreams) return;
      var lang = S.audio || 'hindi';
      if (S.resolvedStreams[lang] && S.resolvedStreams[lang][ep]) {
        chip.setAttribute('data-user-'+lang, S.resolvedStreams[lang][ep]);
        chip.classList.add('resolved');
      }
    });
  },

  // ── HEADLESS MOVIEBOX PARSER ──
  // Opens v.inmoviebox.com URL in hidden proxy iframe, extracts embed source
  scrapeMovieBox: function(mbUrl, callback) {
    var iframe = document.createElement('iframe');
    iframe.className = 'proxy-iframe';
    iframe.sandbox = 'allow-scripts allow-same-origin';
    iframe.src = mbUrl;
    document.body.appendChild(iframe);

    var done = false;
    var timer = setTimeout(function() {
      if (!done) { done = true; cleanup(); callback(null, 'timeout'); }
    }, 4000);

    function cleanup() {
      if (iframe.parentNode) document.body.removeChild(iframe);
      clearTimeout(timer);
    }

    iframe.addEventListener('load', function() {
      if (done) return;
      done = true; clearTimeout(timer);

      try {
        var innerDoc = iframe.contentDocument || iframe.contentWindow.document;
        var html = innerDoc.documentElement.innerHTML;

        // Extract embed URLs from MovieBox page source
        var patterns = [
          /src=["'](https?:\/\/[^"']*(?:vidsrc|2embed|embed|vidcloud|stream)[^"']*)["']/gi,
          /data-src=["'](https?:\/\/[^"']*)["']/gi,
          /iframe.*?src=["']([^"']+)["']/gi
        ];

        var found = [];
        patterns.forEach(function(re) {
          var match;
          while ((match = re.exec(html)) !== null) {
            if (match[1].indexOf('http') === 0) found.push(match[1]);
          }
        });

        if (found.length > 0) {
          callback(found, null);
        } else {
          callback(null, 'no embeds found');
        }
      } catch(e) {
        // Cross-origin — expect this, resolve via catalog
        callback(null, 'cross-origin');
      }
      cleanup();
    });
  },

  // ── BULK MAP from a MovieBox URL ──
  // Parses v.inmoviebox.com/{id} and maps all episodes
  bulkMapFromURL: function(url, callback) {
    var match = url.match(/v\.inmoviebox\.com\/([A-Za-z0-9]+)/);
    var mbKey = match ? match[1] : null;

    if (mbKey && MB_DB[mbKey]) {
      // Already in catalog — resolve instantly
      var entry = MB_DB[mbKey];
      var results = TITAN.preResolve({eps: entry.episodes, _mbKey: mbKey});
      if (callback) callback(results, 'catalog');
      toast('✅ Pre-resolved ' + (entry.episodes||0) + ' eps from catalog');
      return;
    }

    // Not in catalog — headless scrape
    toast('🔍 Headless parsing MovieBox...');
    TITAN.scrapeMovieBox(url, function(sources, err) {
      if (sources && sources.length > 0) {
        // Dynamically create a new catalog entry
        var newKey = mbKey || 'mb_' + Date.now();
        MB_DB[newKey] = {
          tmdbId: 0, season: 1, episodes: 24,
          title: 'MovieBox: ' + url.substring(0, 30),
          tier1: {
            hindi: function(ep) { return sources[0].replace(/\\d+$/, String(ep)); },
            english: function(ep) { return sources[0].replace(/\\d+$/, String(ep)); },
            japanese: function(ep) { return sources[0].replace(/\\d+$/, String(ep)); }
          }
        };
        toast('✅ MovieBox scraped — ' + sources.length + ' sources');
        if (callback) callback(sources, 'scraped');
      } else {
        toast('⚠️ Could not parse MovieBox: ' + (err || 'unknown'));
        if (callback) callback(null, err);
      }
    });
  }
};

window.TITAN = TITAN;
window.MB_DB = MB_DB;

// Hook into playEpisode — use Titan pipeline instead of generic.
// Some older builds did not declare playEpisode before this hook, which threw a
// ReferenceError and stopped the whole boot script before renderGrid() ran.
var _origPlayEpisode = (typeof playEpisode === 'function') ? playEpisode : function(epNum) {
  if (S.cur) TITAN.play(S.cur, epNum, S.audio || 'hindi');
};
var playEpisode = function(epNum) {
  S.ep = epNum;
  if (!S.cur) {
    _origPlayEpisode(epNum);
    return;
  }

  // Check for user/pre-resolved stream overrides first.
  var userSrc = null;
  var chips = document.querySelectorAll('.ep-chip[data-episode="'+epNum+'"]');
  chips.forEach(function(c) {
    var src = c.getAttribute('data-user-'+S.audio);
    if (src && src.length > 5) userSrc = src;
  });

  if (userSrc) {
    $('playerIframe').src = userSrc;
    toast('▶ EP '+epNum+' — '+S.cur.title);
  } else {
    TITAN.play(S.cur, epNum, S.audio || 'hindi');
  }

// ─── SELF-HEALING PING SYSTEM ───
// Background integrity check: every 60s pings resolved stream URLs
// Auto-re-fetches from TITAN if link expires (silent, no interruption)
var TITAN_PING = {
  _interval: null,
  _failed: {},

  start: function() {
    if (TITAN_PING._interval) return;
    TITAN_PING._interval = setInterval(function() {
      if (!S.cur || !S.resolvedStreams) return;
      var entry = TITAN.find(S.cur);
      if (!entry) return;
      // Ping current episode's resolved URL
      var lang = S.audio || 'hindi';
      var currentUrl = S.resolvedStreams[lang] && S.resolvedStreams[lang][S.ep];
      if (currentUrl && !TITAN_PING._failed[currentUrl]) {
        // HEAD request to check if link is still alive
        fetch(currentUrl, {method: 'HEAD', mode: 'no-cors'}).then(function(r) {
          if (!r.ok && r.status !== 0) {
            console.log('[Ping] Link stale, re-resolving...');
            TITAN_PING._failed[currentUrl] = Date.now();
            TITAN.preResolve(S.cur);
          }
        }).catch(function() {});
      }
    }, 60000); // Every 60 seconds
  },

  stop: function() {
    clearInterval(TITAN_PING._interval);
    TITAN_PING._interval = null;
  },

  // Run a full health check on all resolved streams for current anime
  healthCheck: function() {
    if (!S.resolvedStreams) return;
    var total = 0, failed = 0;
    Object.keys(S.resolvedStreams).forEach(function(lang) {
      Object.keys(S.resolvedStreams[lang]).forEach(function(ep) {
        total++;
        var url = S.resolvedStreams[lang][ep];
        if (TITAN_PING._failed[url]) failed++;
      });
    });
    console.log('[Ping] Health: '+(total-failed)+'/'+total+' streams alive, '+failed+' stale');
    if (failed > total * 0.3) {
      console.log('[Ping] >30% stale — triggering full re-resolve');
      TITAN.preResolve(S.cur);
    }
  }
};

};

};
