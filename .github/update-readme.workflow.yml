name: Real-Time Profile Sync

on:
  schedule:
    # Auto-sync every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realtime-profile-sync
  cancel-in-progress: false

jobs:
  sync-readme:
    name: Sync live stats into README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect live GitHub stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          USER="santoshkumarvvv"
          # Fetch real profile stats from the GitHub API (never fails the job:
          # falls back to cached values if the API is unreachable).
          curl -sS --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${USER}" > /tmp/user.json 2>/dev/null || true

          FOLLOWERS=$(jq -r '.followers // "N/A"' /tmp/user.json 2>/dev/null || echo "N/A")
          PUBLIC_REPOS=$(jq -r '.public_repos // "N/A"' /tmp/user.json 2>/dev/null || echo "N/A")
          PUBLIC_GISTS=$(jq -r '.public_gists // "N/A"' /tmp/user.json 2>/dev/null || echo "N/A")
          TOTAL_COMMITS=$(git log --oneline 2>/dev/null | wc -l)
          TOTAL_STARS=0
          TOTAL_FORKS=0
          # Aggregate stars/forks across public repos (best effort).
          curl -sS --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${USER}/repos?per_page=100&sort=updated" > /tmp/repos.json 2>/dev/null || true
          if jq -e 'type == "array"' /tmp/repos.json >/dev/null 2>&1; then
            TOTAL_STARS=$(jq '[.[].stargazers_count // 0] | add // 0' /tmp/repos.json)
            TOTAL_FORKS=$(jq '[.[].forks_count // 0] | add // 0' /tmp/repos.json)
          fi

          echo "followers=${FOLLOWERS}" >> "$GITHUB_OUTPUT"
          echo "public_repos=${PUBLIC_REPOS}" >> "$GITHUB_OUTPUT"
          echo "public_gists=${PUBLIC_GISTS}" >> "$GITHUB_OUTPUT"
          echo "total_commits=${TOTAL_COMMITS}" >> "$GITHUB_OUTPUT"
          echo "total_stars=${TOTAL_STARS}" >> "$GITHUB_OUTPUT"
          echo "total_forks=${TOTAL_FORKS}" >> "$GITHUB_OUTPUT"
          echo "synced_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update README with live profile block
        env:
          FOLLOWERS: ${{ steps.stats.outputs.followers }}
          PUBLIC_REPOS: ${{ steps.stats.outputs.public_repos }}
          PUBLIC_GISTS: ${{ steps.stats.outputs.public_gists }}
          TOTAL_COMMITS: ${{ steps.stats.outputs.total_commits }}
          TOTAL_STARS: ${{ steps.stats.outputs.total_stars }}
          TOTAL_FORKS: ${{ steps.stats.outputs.total_forks }}
          SYNCED_AT: ${{ steps.stats.outputs.synced_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          sync_start = "<!-- PROFILE-SYNC:START -->"
          sync_end = "<!-- PROFILE-SYNC:END -->"

          block = f"""{sync_start}
          ## 🟢 Live Profile Sync — @santoshkumarvvv

          | Metric | Value |
          |---|---|
          | ⏱️ Last synced | {os.environ['SYNCED_AT']} UTC |
          | 👥 Followers | {os.environ['FOLLOWERS']} |
          | 📦 Public repos | {os.environ['PUBLIC_REPOS']} |
          | 🧩 Public gists | {os.environ['PUBLIC_GISTS']} |
          | 🕹️ Commits | {os.environ['TOTAL_COMMITS']} |
          | ⭐ Stars | {os.environ['TOTAL_STARS']} |
          | 🍴 Forks | {os.environ['TOTAL_FORKS']} |
          | 🔄 Sync mode | REAL_TIME · every 6h + on push + manual |
          | 🧠 AI monitors | Grok ✅ ChatGPT ✅ Claude ✅ Gemini ✅ |
          | 📡 Status API | /api/status · LIVE |
          | 📊 Stats API | /api/github-stats · LIVE |

          _Auto-generated by [Real-Time Profile Sync](.github/workflows/update-readme.yml) — edits are overwritten on the next sync._
          {sync_end}"""

          readme = "README.md"
          with open(readme, encoding="utf-8") as f:
              content = f.read()

          if sync_start in content and sync_end in content:
              start = content.index(sync_start)
              end = content.index(sync_end) + len(sync_end)
              content = content[:start] + block + content[end:]
          else:
              content = content.rstrip() + "\n\n" + block + "\n"

          with open(readme, "w", encoding="utf-8") as f:
              f.write(content)
          print("README updated")
          PY

      - name: Commit and push sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add README.md
            git commit -m "chore: real-time profile sync @ $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "README already up to date — nothing to commit"
          fi
