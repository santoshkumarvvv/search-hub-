name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for committed secrets
        run: |
          if grep -rIEn 'gh[pous]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
               --exclude=package-lock.json . ; then
            echo "::error::Possible secret committed"
            exit 1
          fi
          echo "no secrets found"

      - name: Verify required files
        run: |
          for f in package.json next.config.mjs vercel.json render.yaml \
                   public/manifest.webmanifest public/sw.js public/icon.svg; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "ok: $f"
          done
