name: "Autonomous Tech Radar Daemon"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  telemetry-cycle:
    name: Compute Market Velocity & Commit Intelligence Shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Autonomous Intelligence Cycle
        run: |
          mkdir -p data
          cat << 'PY' > update.py
          import json, datetime, urllib.request
          payload = {
              "status": "synchronized",
              "lastCycle": datetime.datetime.utcnow().isoformat() + "Z",
              "engine": "Santosh Tech Radar Daemon v2.5",
              "trackedRepositories": [],
              "marketVelocityMean": None,
              "note": "Live GitHub API aggregation active."
          }
          try:
              req = urllib.request.Request(
                  "https://api.github.com/search/repositories?q=bm25+search+engine&sort=updated&per_page=5",
                  headers={"User-Agent": "search-hub-radar", "Accept": "application/vnd.github+json"}
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode())
              payload["trackedRepositories"] = [i["full_name"] for i in data.get("items", [])]
              payload["marketVelocityMean"] = round(sum(i.get("stargazers_count", 0) for i in data.get("items", [])) / max(len(data.get("items", [])), 1), 2)
          except Exception as e:
              payload["note"] = f"API aggregation failed: {e}"
          with open("data/radar-telemetry.json", "w") as f:
              json.dump(payload, f, indent=2)
          print("Autonomous telemetry cycle completed successfully.")
          PY
          python3 update.py

      - name: Create Pull Request for Telemetry Update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.github_token}}
          commit-message: "telemetry: autonomous radar cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
          title: "telemetry: autonomous radar cycle"
          body: |
            Automated tech radar telemetry update from the Autonomous Tech Radar Daemon.
            - Engine: Santosh Tech Radar Daemon v2.5
            - Tracked repositories: live GitHub API aggregation
            - Market velocity mean: computed from stargazer counts
          branch: telemetry/radar-cycle
          delete-branch: true
