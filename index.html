<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#02110a">
<meta name="description" content="Ultimate Root Security — Cyberpunk AI Terminal with Matrix Rain, Neon Glow, CRT Scanlines, Glitch FX, Web Audio sounds and Voice Control.">
<title>ROOT@SECURITY :: Cyberpunk AI Terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
<style>
/* ============================================================
   ULTIMATE ROOT SECURITY :: CYBERPUNK AI TERMINAL
   ============================================================ */
:root{
  --green:#00ff9c;
  --green-dim:#0b7a52;
  --cyan:#00e5ff;
  --magenta:#ff2bd6;
  --amber:#ffcc00;
  --red:#ff2e4d;
  --bg:#02110a;
  --bg2:#010806;
  --glass:rgba(0,255,156,.05);
  --line:rgba(0,255,156,.28);
  --font:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg2);
  color:var(--green);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  overflow:hidden;
  overscroll-behavior:none;
}

/* ---------- Matrix rain ---------- */
#matrix{position:fixed;inset:0;z-index:0;display:block;opacity:.55;transition:opacity .6s}
body.rain-boost #matrix{opacity:1}

/* ---------- Ambient neon glow ---------- */
.ambient{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 12% 8%, rgba(0,229,255,.13), transparent 60%),
    radial-gradient(55vw 45vh at 88% 92%, rgba(255,43,214,.13), transparent 60%),
    radial-gradient(70vw 60vh at 50% 50%, rgba(0,255,156,.07), transparent 70%);
  mix-blend-mode:screen;
}

/* ---------- CRT scanlines + vignette + flicker ---------- */
.crt{
  position:fixed;inset:0;z-index:60;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,.22) 3px,
    rgba(0,0,0,.22) 4px);
  mix-blend-mode:multiply;
}
.crt::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
}
.crt-beam{
  position:fixed;left:0;right:0;height:26vh;z-index:61;pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,255,156,0), rgba(0,255,156,.055), rgba(0,255,156,0));
  animation:beam 7s linear infinite;
}
@keyframes beam{0%{top:-30vh}100%{top:110vh}}
.flicker{position:fixed;inset:0;z-index:62;pointer-events:none;background:rgba(0,255,156,.02);animation:flick 4s steps(2) infinite}
@keyframes flick{0%,96%{opacity:0}97%{opacity:.5}98%{opacity:0}99%{opacity:.7}100%{opacity:0}}
body.no-fx .crt,body.no-fx .crt-beam,body.no-fx .flicker{display:none}

/* ---------- Layout shell ---------- */
.shell{
  position:relative;z-index:10;
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;
  padding:10px;gap:8px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.frame{
  flex:1;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg, rgba(2,17,10,.92), rgba(1,8,6,.96));
  box-shadow:0 0 0 1px rgba(0,255,156,.06) inset, 0 0 42px rgba(0,255,156,.14), 0 0 120px rgba(0,229,255,.07);
  backdrop-filter:blur(3px);
  overflow:hidden;
}

/* ---------- Title bar ---------- */
.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg, rgba(0,255,156,.10), rgba(0,229,255,.05), rgba(255,43,214,.08));
}
.dots{display:flex;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px currentColor}
.dot.r{background:#ff2e4d;color:#ff2e4d}
.dot.y{background:#ffcc00;color:#ffcc00}
.dot.g{background:#00ff9c;color:#00ff9c}
.title{
  font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);
  text-shadow:0 0 10px rgba(0,229,255,.8);white-space:nowrap;
}
.bar .spacer{flex:1}
.stat{
  font-size:11px;letter-spacing:1px;color:var(--green-dim);
  border:1px solid rgba(0,255,156,.2);border-radius:999px;padding:2px 9px;white-space:nowrap;
}
.stat b{color:var(--green)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle}
.led.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Output area ---------- */
#out{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px 4px;
  scrollbar-width:thin;scrollbar-color:var(--green-dim) transparent;
  -webkit-overflow-scrolling:touch;
}
#out::-webkit-scrollbar{width:8px}
#out::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:8px}
.line{white-space:pre-wrap;word-break:break-word;margin:0 0 2px;text-shadow:0 0 6px rgba(0,255,156,.35)}
.c-green{color:var(--green)}
.c-cyan{color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,.5)}
.c-mag{color:var(--magenta);text-shadow:0 0 8px rgba(255,43,214,.5)}
.c-amber{color:var(--amber);text-shadow:0 0 8px rgba(255,204,0,.5)}
.c-red{color:var(--red);text-shadow:0 0 8px rgba(255,46,77,.6)}
.c-dim{color:#4f7f68;text-shadow:none}
.c-white{color:#dfffef}
.bold{font-weight:700}
.line a{color:var(--cyan);text-decoration:underline dotted}
.banner{
  font-size:clamp(6px,1.85vw,13px);line-height:1.1;white-space:pre;overflow-x:auto;
  color:var(--green);text-shadow:0 0 12px rgba(0,255,156,.7), 0 0 26px rgba(0,229,255,.35);
}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--glass)}
.kv{display:grid;grid-template-columns:minmax(96px,150px) 1fr;gap:2px 12px;font-size:13.5px}
.kv .k{color:var(--cyan)}
.kv .v{color:#cdfbe6;word-break:break-word}

/* progress bars */
.pbar{display:flex;align-items:center;gap:8px;font-size:13px}
.pbar .track{flex:1;height:9px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:rgba(0,0,0,.5);min-width:80px}
.pbar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 12px var(--green);transition:width .12s linear}
.pbar .pct{width:44px;text-align:right;color:var(--cyan)}

/* glitch */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{
  content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;
}
.glitch::before{color:var(--magenta);animation:gl1 .55s infinite linear alternate-reverse;clip-path:inset(0 0 55% 0)}
.glitch::after{color:var(--cyan);animation:gl2 .48s infinite linear alternate-reverse;clip-path:inset(52% 0 0 0)}
@keyframes gl1{0%{transform:translate(0)}25%{transform:translate(-2px,-1px)}50%{transform:translate(2px,1px)}100%{transform:translate(-1px,1px)}}
@keyframes gl2{0%{transform:translate(0)}25%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}100%{transform:translate(1px,-1px)}}
body.shake .frame{animation:shake .35s linear}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-4px,2px) skewX(.6deg)}
  40%{transform:translate(4px,-2px) skewX(-.6deg)}
  60%{transform:translate(-3px,-1px)}
  80%{transform:translate(3px,1px)}
}
body.alarm .frame{border-color:var(--red);box-shadow:0 0 40px rgba(255,46,77,.5), 0 0 90px rgba(255,46,77,.25)}
.rgb-split{animation:rgbs .18s steps(2) 6}
@keyframes rgbs{0%{filter:none}50%{filter:drop-shadow(2px 0 var(--red)) drop-shadow(-2px 0 var(--cyan))}100%{filter:none}}

/* ---------- Input row ---------- */
.inputbar{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-top:1px solid var(--line);
  background:linear-gradient(90deg, rgba(0,255,156,.07), rgba(0,229,255,.03));
}
.prompt{color:var(--magenta);white-space:nowrap;font-weight:700;text-shadow:0 0 10px rgba(255,43,214,.6);font-size:14px}
#cmd{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--green);font-family:var(--font);font-size:16px;caret-color:transparent;
  text-shadow:0 0 8px rgba(0,255,156,.6);
}
#cmd::placeholder{color:#2f6a55}
.caret{width:10px;height:18px;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
.iconbtn{
  flex:none;width:38px;height:38px;border-radius:10px;
  border:1px solid var(--line);background:rgba(0,255,156,.07);
  color:var(--green);font-size:16px;cursor:pointer;display:grid;place-items:center;
  transition:.18s;
}
.iconbtn:hover{background:rgba(0,255,156,.18);box-shadow:0 0 14px rgba(0,255,156,.4)}
.iconbtn.active{color:var(--magenta);border-color:var(--magenta);box-shadow:0 0 16px rgba(255,43,214,.6);background:rgba(255,43,214,.12)}
.iconbtn.off{color:#3d6b5b;border-color:rgba(0,255,156,.15)}

/* ---------- Quick chips ---------- */
.chips{
  display:flex;gap:7px;overflow-x:auto;padding:8px 10px;
  border-top:1px solid rgba(0,255,156,.14);scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);border-radius:999px;
  background:rgba(0,229,255,.06);color:var(--cyan);
  padding:5px 12px;font-size:12.5px;font-family:var(--font);cursor:pointer;transition:.18s;white-space:nowrap;
}
.chip:hover{background:rgba(0,229,255,.2);box-shadow:0 0 14px rgba(0,229,255,.4);transform:translateY(-1px)}
.chip.hot{color:var(--magenta);border-color:rgba(255,43,214,.45);background:rgba(255,43,214,.08)}

/* ---------- Boot overlay ---------- */
#boot{
  position:fixed;inset:0;z-index:120;background:#010806;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;transition:opacity .5s;
}
#boot .bigskull{font-size:clamp(48px,14vw,86px);filter:drop-shadow(0 0 22px var(--green));animation:pulse 1.6s infinite}
#boot h1{
  margin:0;font-size:clamp(17px,4.6vw,32px);letter-spacing:3px;color:var(--green);
  text-shadow:0 0 18px rgba(0,255,156,.8);
}
#boot p{margin:0;color:var(--cyan);font-size:clamp(11px,2.8vw,14px);letter-spacing:1.5px}
#boot .enter{
  margin-top:8px;border:1px solid var(--green);background:rgba(0,255,156,.1);color:var(--green);
  padding:13px 30px;border-radius:10px;font-family:var(--font);font-size:15px;letter-spacing:2px;cursor:pointer;
  box-shadow:0 0 24px rgba(0,255,156,.35);transition:.2s;
}
#boot .enter:hover{background:var(--green);color:#02110a;box-shadow:0 0 40px var(--green)}
#boot .hint{color:#4f7f68;font-size:11.5px;letter-spacing:1px}
#boot.gone{opacity:0;pointer-events:none}

/* ---------- Voice listening overlay ---------- */
#voicehud{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;
  display:none;align-items:center;gap:10px;
  border:1px solid var(--magenta);border-radius:999px;padding:8px 18px;
  background:rgba(20,0,16,.86);color:var(--magenta);font-size:13px;letter-spacing:1px;
  box-shadow:0 0 26px rgba(255,43,214,.5);max-width:92vw;
}
#voicehud.on{display:flex}
.wave{display:flex;align-items:flex-end;gap:3px;height:16px}
.wave i{width:3px;background:var(--magenta);border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}
.wave i:nth-child(3){animation-delay:.3s}
.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}

/* ---------- Mobile ---------- */
@media (max-width:720px){
  body{font-size:13.5px}
  .shell{padding:6px;gap:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .frame{border-radius:11px}
  .bar{padding:7px 9px;gap:7px}
  .title{font-size:11px;letter-spacing:1.2px}
  .stat{font-size:9.5px;padding:2px 7px}
  .stat.hide-sm{display:none}
  #out{padding:10px 10px 2px}
  .kv{grid-template-columns:1fr;gap:0 0}
  .kv .k{margin-top:5px}
  .inputbar{padding:7px 9px;gap:6px}
  .prompt{font-size:12px}
  .iconbtn{width:36px;height:36px}
  #voicehud{bottom:112px;font-size:11.5px;padding:7px 14px}
}
@media (max-width:400px){
  .title{font-size:10px}
  .prompt{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .crt-beam,.flicker,.glitch::before,.glitch::after{animation:none}
}
</style>
</head>
<body class="no-select">

<canvas id="matrix"></canvas>
<div class="ambient"></div>

  <p>CYBERPUNK&nbsp;AI&nbsp;TERMINAL&nbsp;v3.0</p>

<script>
"use strict";
/* ============================================================
   ULTIMATE ROOT SECURITY :: CYBERPUNK AI TERMINAL  v3.0
   Single-file. No dependencies. Runs fully client-side.
   ============================================================ */
const $ = (s) => document.querySelector(s);
const out    = $('#out');
const input  = $('#cmd');
const bootEl = $('#boot');
const frame  = $('#frame');

const STATE = {
  booted:false, sound:true, listening:false, busy:false,
  user:'guest', host:'security', root:false,
  history:[], hIdx:-1, start:Date.now(), rainBoost:false, fx:true
};

/* ============================================================
   1. MATRIX RAIN
   ============================================================ */
const canvas = $('#matrix'), ctx = canvas.getContext && canvas.getContext('2d');
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789$#@%&*+=<>/\\|ROOTSECURITY';
let cols = 0, drops = [], speeds = [], fsize = 16, dpr = 1;

function sizeMatrix(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth  * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  fsize = innerWidth < 620 ? 13 : 17;
  cols = Math.ceil(innerWidth / fsize);
  drops = new Array(cols).fill(0).map(() => Math.random() * -60);
  speeds = new Array(cols).fill(0).map(() => 0.5 + Math.random() * 0.9);
}
sizeMatrix();
addEventListener('resize', sizeMatrix);

let mFrame = 0;
function drawMatrix(){
  if (!ctx) return;                                    // graceful degrade: no canvas support
  requestAnimationFrame(drawMatrix);
  mFrame++;
  if (mFrame % (STATE.rainBoost ? 1 : 2)) return;      // throttle for battery
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = 'rgba(1,8,6,0.09)';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.font = fsize + 'px ' + getComputedStyle(document.body).fontFamily;
  for (let i=0;i<cols;i++){
    const ch = GLYPHS[(Math.random()*GLYPHS.length)|0];
    const x = i*fsize, y = drops[i]*fsize;
    if (Math.random() > 0.985){ ctx.fillStyle='#dfffef'; ctx.shadowColor='#00ff9c'; ctx.shadowBlur=14; }
    else if (STATE.rainBoost && Math.random()>0.97){ ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=10; }
    else { ctx.fillStyle = STATE.alarm ? '#ff2e4d' : '#00ff9c'; ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
    ctx.fillText(ch, x, y);
    ctx.shadowBlur = 0;
    if (y > innerHeight && Math.random() > 0.975) drops[i] = Math.random()*-20;
    drops[i] += speeds[i] * (STATE.rainBoost ? 1.9 : 1);
  }
}
drawMatrix();

/* ============================================================
   2. WEB AUDIO API — synth sound engine
   ============================================================ */
let AC = null;
function ac(){
  if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur=0.08, type='square', vol=0.06, slideTo=null){
  if (!STATE.sound) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noise(dur=0.25, vol=0.05, filterFreq=900){
  if (!STATE.sound) return;
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filterFreq;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  key:   () => tone(1200 + Math.random()*500, 0.03, 'square', 0.022),
  enter: () => { tone(760,0.05,'square',0.05); setTimeout(()=>tone(1180,0.07,'square',0.045),45); },
  ok:    () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.05),i*70)); },
  err:   () => { tone(200,0.22,'sawtooth',0.07,90); noise(0.16,0.035,420); },
  boot:  () => { [110,165,220,330,440,660].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'sine',0.07),i*95)); },
  blip:  () => tone(1550,0.035,'sine',0.03),
  scan:  () => tone(420,0.05,'sawtooth',0.028,880),
  alarm: () => { let n=0; const iv=setInterval(()=>{ tone(n%2?680:980,0.14,'square',0.055); if(++n>7) clearInterval(iv); },160); },
  breach:() => { noise(0.7,0.09,240); [880,660,440,220,110].forEach((f,i)=>setTimeout(()=>tone(f,0.24,'sawtooth',0.06),i*110)); },
  glitch:() => { noise(0.14,0.06,1600); tone(90,0.12,'square',0.05); }
};

/* ============================================================
   3. OUTPUT ENGINE
   ============================================================ */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function scroll(){ out.scrollTop = out.scrollHeight; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function print(text='', cls='c-green'){
  const l = el('div', 'line ' + cls, text);
  out.appendChild(l); scroll(); return l;
}
function printRaw(node){ out.appendChild(node); scroll(); return node; }

/* typewriter printing */
function typeLine(text, cls='c-green', speed=12){
  return new Promise(res => {
    const l = el('div','line '+cls,''); out.appendChild(l);
    let i=0;
    (function step(){
      if (i >= text.length){ scroll(); return res(l); }
      const chunk = Math.max(1, Math.round(text.length/70));
      l.textContent += text.slice(i, i+chunk); i += chunk;
      if (i % 3 === 0) SFX.blip();
      scroll();
      setTimeout(step, speed);
    })();
  });
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function progress(label, ms=1400, color='c-green'){
  const wrap = el('div','line pbar '+color);
  wrap.innerHTML = `<span style="min-width:0;flex:none">${esc(label)}</span>
     <span class="track"><span class="fill"></span></span><span class="pct">0%</span>`;
  out.appendChild(wrap); scroll();
  const fill = wrap.querySelector('.fill'), pct = wrap.querySelector('.pct');
  const steps = 26;
  for (let i=1;i<=steps;i++){
    await sleep(ms/steps);
    const p = Math.round(i/steps*100);
    fill.style.width = p + '%'; pct.textContent = p + '%';
    if (i%4===0) SFX.scan();
    scroll();
  }
  return wrap;
}

/* natural language → command mapping */
function mapVoice(t){
  t = t.replace(/[.,!?]/g,'').trim();
  const rules = [
    [/^(open |go to |show )?help( me)?$/, 'help'],
    [/^(clear|clean|reset)( screen| terminal)?$/, 'clear'],
    [/^(matrix|matrix mode|rain)$/, 'matrix'],
    [/^(root|root access|become root|sudo)$/, 'root'],
    [/^(hack|hack it|start hack|hacking|attack)( mode| now)?$/, 'hack'],
    [/^(time|what.*time.*|date)$/, 'time'],
    [/^(system info|system information|sysinfo|system)$/, 'system_info'],
    [/^(who am i|whoami)$/, 'whoami'],
    [/^(about|banner)$/, 'banner']
  ];
  for (const [re, cmd] of rules) if (re.test(t)) return cmd;
  let m = t.match(/^(?:search|google|find|look up)\s+(?:for\s+)?(.+)$/);      if (m) return 'search ' + m[1];
  m     = t.match(/^(?:youtube|play|watch|video)\s+(?:for\s+)?(.+)$/);        if (m) return 'youtube ' + m[1];
  m     = t.match(/^(?:calculate|calc|compute|what is)\s+(.+)$/);             if (m) return 'calc ' + wordsToMath(m[1]);
  return t;
}

  return s.replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-')
          .replace(/\b(times|multiplied by|into|x)\b/g,'*')
          .replace(/\b(divided by|over|by)\b/g,'/')
          .replace(/\bpercent of\b/g,'/100*').replace(/\bto the power of\b/g,'^');
}

/* ============================================================
   5. SAFE CALCULATOR (no eval) — shunting yard
   ============================================================ */
function calcEval(expr){
  const CONST = { pi: Math.PI, e: Math.E };
  const FN = { sin:Math.sin, cos:Math.cos, tan:Math.tan, sqrt:Math.sqrt, log:Math.log10,
               ln:Math.log, abs:Math.abs, round:Math.round, floor:Math.floor, ceil:Math.ceil };
  const src = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'').toLowerCase();
  const tokens = src.match(/\d+\.?\d*|[a-z]+|[+\-*/%^()]/g);
  if (!tokens) throw new Error('empty expression');
  const prec = { '+':1,'-':1,'*':2,'/':2,'%':2,'^':3,'u-':4 };
  const rightAssoc = { '^':true,'u-':true };
  const outQ = [], ops = [];
  let prev = null;
  for (const t of tokens){
    if (/^\d/.test(t)) { outQ.push(parseFloat(t)); }
    else if (/^[a-z]+$/.test(t)){
      if (t in CONST) outQ.push(CONST[t]);
      else if (t in FN) ops.push(t);
      else throw new Error('unknown symbol: ' + t);
    }
    else if (t === '('){ ops.push(t); }
    else if (t === ')'){
      while (ops.length && ops[ops.length-1] !== '(') outQ.push(ops.pop());
      if (!ops.length) throw new Error('unbalanced )');
      ops.pop();
      if (ops.length && ops[ops.length-1] in FN) outQ.push(ops.pop());
    } else {
      let op = t;
      if (op === '-' && (prev === null || prev === '(' || (prev in prec))) op = 'u-';
      while (ops.length){
        const top = ops[ops.length-1];
        if (top === '(') break;
        const tp = (top in FN) ? 5 : prec[top];
        if (tp > prec[op] || (tp === prec[op] && !rightAssoc[op])) outQ.push(ops.pop()); else break;
      }
      ops.push(op);
    }
    prev = t;
  }
  while (ops.length){ const o = ops.pop(); if (o === '(') throw new Error('unbalanced ('); outQ.push(o); }
  const st = [];
  for (const t of outQ){
    if (typeof t === 'number'){ st.push(t); continue; }
    if (t in FN){ const a = st.pop(); if (a===undefined) throw new Error('bad args'); st.push(FN[t](a)); continue; }
    if (t === 'u-'){ const a = st.pop(); st.push(-a); continue; }
    const b = st.pop(), a = st.pop();
    if (a === undefined || b === undefined) throw new Error('malformed expression');
    st.push(t==='+'?a+b : t==='-'?a-b : t==='*'?a*b : t==='/'?a/b : t==='%'?a%b : Math.pow(a,b));
  }
  if (st.length !== 1) throw new Error('malformed expression');
  return st[0];
}

      : print('cat: ' + esc(a||'') + ': No such file or directory', 'c-red'),
  pwd: () => print('/home/' + (STATE.root ? 'root' : 'guest'), 'c-cyan')
};

async function run(raw, fromVoice=false){
  const line = String(raw || '').trim();
  const prompt = el('div','line');
  prompt.innerHTML = `<span class="c-mag bold">${STATE.root?'root':'guest'}@security</span><span class="c-dim">:~$</span> <span class="c-white">${esc(line)}</span>` +
                     (fromVoice ? ' <span class="c-mag">🎤</span>' : '');
  printRaw(prompt);
  if (!line) return;
  STATE.history.push(line); STATE.hIdx = STATE.history.length;

  const sp = line.indexOf(' ');
  const name = (sp === -1 ? line : line.slice(0, sp)).toLowerCase();
  const args = sp === -1 ? '' : line.slice(sp+1).trim();

  const fn = COMMANDS[name];
  if (!fn){
    SFX.err(); glitchBurst(280);
    print(`command not found: ${esc(name)}`, 'c-red');
    const guess = Object.keys(COMMANDS).find(k => k.startsWith(name.slice(0,2)) && name.length>1);
    if (guess) print(`did you mean: ${guess} ?`, 'c-amber');
    print("type 'help' to list all available commands.", 'c-dim');
    return;
  }
  try{ await fn(args); }
  catch(e){ print('[RUNTIME ERROR] ' + esc(e.message), 'c-red'); SFX.err(); }
  scroll();
}

/* ============================================================
   9. INPUT HANDLING
   ============================================================ */
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    const v = input.value; input.value = '';
    SFX.enter(); run(v);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    if (STATE.hIdx > 0){ STATE.hIdx--; input.value = STATE.history[STATE.hIdx]; }
  } else if (e.key === 'ArrowDown'){
    e.preventDefault();
    if (STATE.hIdx < STATE.history.length-1){ STATE.hIdx++; input.value = STATE.history[STATE.hIdx]; }
    else { STATE.hIdx = STATE.history.length; input.value = ''; }
  } else if (e.key === 'Tab'){
    e.preventDefault();
    const p = input.value.toLowerCase();
    const hits = Object.keys(COMMANDS).filter(k => k.startsWith(p) && p);
    if (hits.length === 1){ input.value = hits[0] + ' '; SFX.blip(); }
    else if (hits.length > 1){ print(hits.join('   '), 'c-dim'); SFX.blip(); }
  } else if (e.key === 'l' && e.ctrlKey){ e.preventDefault(); cmdClear(); }
  else { SFX.key(); }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('button') || e.target.closest('a') || window.getSelection().toString()) return;
  if (STATE.booted) input.focus();
});

async function boot(){
  STATE.booted = true;
  SFX.boot();
  printBanner();
  print('');
  for (const [t,c] of BOOT_LINES){ print(t, c); SFX.scan(); await sleep(140); }
  print('');
  await progress('  establishing secure tunnel ', 900, 'c-cyan');
  print('');
  await typeLine('SYSTEM READY. Welcome, operator.', 'c-white bold', 22);
  print("Type 'help' for the command matrix  ·  tap 🎤 for voice control.", 'c-dim');
  print('');
  speak('System ready. Welcome, operator.');
  input.focus();
}

$('#enterBtn').addEventListener('click', () => {
  ac(); initVoice();
  bootEl.classList.add('gone');
  setTimeout(() => { bootEl.remove(); boot(); }, 400);
});
addEventListener('keydown', (e) => {

});
