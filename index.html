<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07040f" />
<title>Queenie — वॉइस AI असिस्टेंट</title>
<meta name="description" content="Queenie — हिंदी/इंग्लिश वॉइस-कंट्रोल्ड AI असिस्टेंट। बोलो और सुनो, ब्राउज़र में ही।" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="bg-aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">Q</div>
    <div class="brand-text">
      <h1>Queenie</h1>
      <span class="brand-sub" id="brand-sub">वॉइस AI असिस्टेंट</span>
    </div>
  </div>
  <div class="top-actions">
    <span class="chip" id="mode-chip" title="जवाब का इंजन">लोकल</span>
    <button class="icon-btn" id="gear-btn" title="सेटिंग्स" aria-label="सेटिंग्स">⚙</button>
  </div>
</header>

<main class="stage">

  <!-- ===== AVATAR (pure SVG — हमेशा दिखेगा) ===== -->
  <div class="avatar-wrap" id="avatar-wrap">
    <div class="avatar-ring" id="avatar-ring"></div>
    <svg class="avatar" id="avatar" viewBox="0 0 240 260" role="img" aria-label="Queenie अवतार">
      <defs>
        <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b1d5e"/><stop offset="55%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#a21caf"/>
        </linearGradient>
        <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffdcc7"/><stop offset="100%" stop-color="#f2b79b"/>
        </linearGradient>
        <linearGradient id="lipG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff5fa2"/><stop offset="100%" stop-color="#d81b60"/>
        </linearGradient>
        <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff2d95" stop-opacity=".55"/><stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>

      <ellipse cx="120" cy="140" rx="108" ry="112" fill="url(#glowG)"/>

      <!-- back hair -->
      <path d="M120 22c-52 0-82 36-82 88 0 40 6 66 12 92h34c-10-34-14-60-12-84 22 10 74 10 96 0 2 24-2 50-12 84h34c6-26 12-52 12-92 0-52-30-88-82-88z" fill="url(#hairG)"/>

      <!-- ears (tucked near the face, not floating outside the hair) -->
      <ellipse cx="63" cy="142" rx="8" ry="13" fill="url(#skinG)"/>
      <ellipse cx="177" cy="142" rx="8" ry="13" fill="url(#skinG)"/>

      <!-- face -->
      <path d="M120 54c-36 0-60 26-60 66 0 44 26 78 60 78s60-34 60-78c0-40-24-66-60-66z" fill="url(#skinG)"/>

      <!-- fringe -->
      <path d="M120 40c-40 0-64 26-64 62 6-18 16-30 30-36 16 22 68 26 96 8 6 8 9 18 10 28 2-38-24-62-72-62z" fill="url(#hairG)"/>

      <!-- brows -->
      <path class="brow" id="brow-l" d="M82 112c8-6 20-7 28-3" stroke="#4a2464" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="brow" id="brow-r" d="M130 109c8-4 20-3 28 3" stroke="#4a2464" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- eyes -->
      <g id="eyes">
        <g class="eye">
          <ellipse cx="96" cy="134" rx="15" ry="11" fill="#fff"/>
          <circle class="iris" cx="96" cy="134" r="7.5" fill="#7c3aed"/>
          <circle cx="96" cy="134" r="3.4" fill="#1b0b2a"/>
          <circle cx="99" cy="131" r="2.2" fill="#fff" opacity=".9"/>
        </g>
        <g class="eye">
          <ellipse cx="144" cy="134" rx="15" ry="11" fill="#fff"/>
          <circle class="iris" cx="144" cy="134" r="7.5" fill="#7c3aed"/>
          <circle cx="144" cy="134" r="3.4" fill="#1b0b2a"/>
          <circle cx="147" cy="131" r="2.2" fill="#fff" opacity=".9"/>
        </g>
        <!-- eyelids (blink) -->
        <rect class="lid" id="lid-l" x="81" y="123" width="30" height="0" rx="4" fill="url(#skinG)"/>
        <rect class="lid" id="lid-r" x="129" y="123" width="30" height="0" rx="4" fill="url(#skinG)"/>
      </g>

      <!-- blush -->
      <ellipse cx="82" cy="158" rx="13" ry="8" fill="#ff8fb8" opacity=".45" filter="url(#soft)"/>
      <ellipse cx="158" cy="158" rx="13" ry="8" fill="#ff8fb8" opacity=".45" filter="url(#soft)"/>

      <!-- nose -->
      <path d="M120 143v12c0 3-3 5-6 5" stroke="#d9906f" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- mouth (JS animates height while speaking) -->
      <g id="mouth-g">
        <ellipse id="mouth" cx="120" cy="180" rx="17" ry="5" fill="url(#lipG)"/>
        <path id="smile" d="M103 178q17 12 34 0" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- neck + shoulders -->
      <path d="M105 194q15 10 30 0v18c0 7 13 9 29 15 15 6 24 15 26 33H50c2-18 11-27 26-33 16-6 29-8 29-15z" fill="url(#skinG)"/>
      <path d="M76 227c-15 6-24 15-26 33h140c-2-18-11-27-26-33-6 16-24 24-44 24s-38-8-44-24z" fill="#2a1140"/>
      <path d="M120 251c-20 0-38-8-44-24l-4 2c8 18 27 27 48 27s40-9 48-27l-4-2c-6 16-24 24-44 24z" fill="#a855f7" opacity=".35"/>
    </svg>
    <canvas id="viz" class="viz" aria-hidden="true"></canvas>
  </div>

  <p class="status" id="status">तैयार हूँ — माइक दबाकर बोलिए 🎤</p>
  <p class="subtle" id="hint">या नीचे टाइप करके भेजिए</p>

  <!-- ===== CHAT (हमेशा दिखने वाला) ===== -->
  <section class="chat-card">
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="mic-btn" id="mic-btn" title="बोलने के लिए दबाएँ" aria-label="माइक">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
      </button>
      <input id="text-input" type="text" placeholder="यहाँ लिखिए…" />
      <button type="submit" class="send-btn" title="भेजें" aria-label="भेजें">➤</button>
    </form>
  </section>

  <div class="quickbar">
    <button class="pill" data-q="तुम्हें किसने बनाया है?">किसने बनाया?</button>
    <button class="pill" data-q="तुम मेरे लिए क्या कर सकती हो?">क्या कर सकती हो?</button>
    <button class="pill" data-q="अभी समय क्या हुआ है?">समय बताओ</button>
    <button class="pill" data-q="एक जोक सुनाओ">जोक सुनाओ</button>
  </div>

  <div class="toolbar">
    <button class="pill" id="handsfree-btn" title="लगातार सुनती रहूँ">🔁 हैंड्स-फ्री</button>
    <button class="pill" id="lang-btn"><span id="lang-label">हिन्दी</span></button>
    <button class="pill" id="stop-btn" title="बोलना रोको">⏹ रोको</button>
    <button class="pill" id="diag-btn" title="सपोर्ट जाँच">🩺 जाँच</button>
  </div>
</main>

<!-- Settings -->
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="settings" aria-hidden="true">
  <div class="sheet-head">
    <strong>⚙ सेटिंग्स</strong>
    <button class="icon-btn" id="settings-close" aria-label="बंद करें">✕</button>
  </div>

  <label class="row"><span>आवाज़ (TTS)</span>
    <select id="voice-select"></select>
  </label>
  <label class="row"><span>बोलने की गति</span>
    <input id="rate" type="range" min="0.6" max="1.4" step="0.05" value="1" />
  </label>
  <label class="row"><span>पिच</span>
    <input id="pitch" type="range" min="0.6" max="1.6" step="0.05" value="1.15" />
  </label>

  <div class="divider"></div>

  <p class="note">वैकल्पिक: अपनी AI API जोड़िए (OpenAI-कम्पैटिबल / xAI Grok)। बिना key के भी Queenie लोकल इंजन से जवाब देती है।</p>
  <label class="row"><span>API Base URL</span>
    <input id="api-base" type="text" placeholder="https://api.x.ai/v1" />
  </label>
  <label class="row"><span>API Key</span>
    <input id="api-key" type="password" placeholder="xai-… / sk-…" autocomplete="off" />
  </label>
  <label class="row"><span>Model</span>
    <input id="api-model" type="text" placeholder="grok-3 / gpt-4o-mini" />
  </label>
  <label class="row"><span>API इस्तेमाल करें</span>
    <input id="use-api" type="checkbox" />
  </label>
  <div class="row btns">
    <button class="pill solid" id="save-settings">सेव करें</button>
    <button class="pill" id="test-api">टेस्ट</button>
    <button class="pill" id="clear-chat">चैट साफ़</button>
  </div>
  <p class="note small">Key सिर्फ़ आपके ब्राउज़र के localStorage में रहती है, कहीं भेजी नहीं जाती।</p>
</aside>

<div class="toast" id="toast"></div>

<script src="assets/js/brain.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
