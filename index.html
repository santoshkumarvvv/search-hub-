<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Search Hub - Designed by Santosh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #2ed573;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .search-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #2ed573;
            background: #1e1e2e;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background-color: #2ed573;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #26af5f;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background: #1e1e2e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h3 {
            font-size: 15px;
            margin-top: 10px;
            color: #ffa502;
        }
        .card p {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Anime Search Hub 🔥</h1>
        <p class="subtitle">Designed by Santosh</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search Anime (e.g., Naruto, Solo Leveling)...">
        <button onclick="searchAnime()">Search</button>
    </div>

    <div class="results" id="results"></div>

    <footer>
        <p>© Designed & Developed by Santosh</p>
    </footer>

    <script>
        async function searchAnime() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="grid-column: 1/-1;">Searching Anime...</p>';

            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=8`);
                const data = await response.json();
                
                resultsDiv.innerHTML = '';
                if (!data.data || data.data.length === 0) {
                    resultsDiv.innerHTML = '<p style="grid-column: 1/-1;">No results found.</p>';
                    return;
                }

                data.data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                        <h3>${anime.title}</h3>
                        <p>Score: ${anime.score ? anime.score : 'N/A'}</p>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<p style="grid-column: 1/-1;">Error loading results. Try again!</p>';
            }
        }
    </script>
</body>
</html>
